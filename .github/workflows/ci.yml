name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Node 22.6+ es obligatorio, no una preferencia. `test:unit` y `test:rules`
# corren los archivos `.ts` directo con `node --test`, sin paso de
# compilación, usando el type-stripping nativo de Node. Con Node 20 el
# runner no sabe parsear `.ts` y ambos jobs mueren con exit code 1 aunque
# el código esté bien. `package.json#engines` dice lo mismo.
env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

# Sin esto el workflow hereda el default del repositorio. Los jobs sólo
# testean y compilan: `contents: read` para clonar alcanza.
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # SIN `cache: 'gradle'`: el emulador de Firestore se baja un JAR,
          # no hay ningún wrapper ni build.gradle en el repo, y el cache de
          # Gradle aborta el job con "No file matched to [**/*.gradle*]".
          # Eso tumbaba `test-rules` y, como `build` depende de él, el
          # deploy entero se caía aunque los testsaran en verde.

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests
        run: npm run test:rules

  test-e2e:
    name: E2E Circuit (Emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # SIN `cache: 'gradle'`: ver test-rules, mismo motivo.

      - name: Install dependencies
        run: npm ci

      - name: Run e2e circuit
        run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-unit, test-rules, test-e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: |
            dist/
            public/widget/
          retention-days: 1
