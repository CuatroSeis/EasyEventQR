name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Node 22.6+ es obligatorio, no una preferencia. `test:unit` y `test:rules`
# corren los archivos `.ts` directo con `node --test`, sin paso de
# compilación, usando el type-stripping nativo de Node. Con Node 20 el
# runner no sabe parsear `.ts` y ambos jobs mueren con exit code 1 aunque
# el código esté bien. `package.json#engines` dice lo mismo.
env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

# Sin esto el workflow hereda el default del repositorio, que suele ser
# `write-all` o `contents: write` según dónde se armó. El token que
# corre tests de un PR no necesita escribir nada en el repo, y menos
# todavía en `pull_request`, donde el código es del que propone el PR.
#
# Lo que sí hace falta:
#   - `contents: read` para clonar.
#   - `id-token: write` en el job de deploy, porque la CLI de Vercel
#     autenticando con OIDC pide un token de la Actions.
#
# OJO: el permiso se acota al job, no al workflow. Si se deja arriba
# aplica también a los jobs de test, que es justo lo que se quiere evitar.
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # SIN `cache: 'gradle'`: el emulador de Firestore se baja un JAR,
          # no hay ningún wrapper ni build.gradle en el repo, y el cache de
          # Gradle aborta el job con "No file matched to [**/*.gradle*]".
          # Eso tumbaba `test-rules` y, como `build` depende de él, el
          # deploy entero se caía aunque los testsaran en verde.

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests
        run: npm run test:rules

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-unit, test-rules]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            public/widget/
          retention-days: 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    # La CLI de Vercel con OIDC pide un token de la Actions. Este es el
    # único job que lo necesita; el default del workflow sigue siendo
    # `contents: read`.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Se despliega la RAÍZ (`.`), no `dist/`.
      #
      # `vercel deploy dist/` sube SÓLO la carpeta de build: el sitio
      # subía y cada /api/* daba 404, porque las funciones de `api/` nunca
      # viajaban. Con la raíz, Vercel corre su propio `npm run build`
      # (está en vercel.json) y sube `api/` junto.
      #
      # Por eso YA NO se baja el artifact `dist` del job de build: acá Vercel
      # recompila, y un bundle local sólo agregaría la tentación de
      # volver a pasar `dist/` por error. El job de build sigue existiendo
      # como puerta: si el typecheck o los tests fallan, `needs: build` no
      # deja llegar acá.

# Auth: token estático en `VERCEL_TOKEN`.
      #
      # Se probó OIDC primero (sin `--token`, con `id-token: write`) y no
      # va: la CLI responde "No existing credentials found" porque exige la
      # app de Vercel instalada en el repo, que se fue cuando se desconectó
      # la integración Git. Si alguna vez se reinstala, OIDC es mejor —
      # `VERCEL_TOKEN` es una credencial de larga vida que envejece sin
      # avisar, y cuando dejó de resolver el job murió con un 404 que se
      # lee como si fuera un problema de código.
      #
      # Sin `--scope`: ese flag espera el *slug* del equipo
      # ("cuatroseis-projects") y `VERCEL_ORG_ID` guarda el *id*
      # ("team_...", el mismo de `.vercel/project.json`). Con los dos
      # juntos la CLI responde "You do not have access to the specified
      # account". El proyecto ya está en `.vercel/project.json`, así que
      # alcanza con `--project`.
      - name: Deploy to Vercel Preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --project=${{ secrets.VERCEL_PROJECT_ID }} \
            --alias=pr-${{ github.event.number }}-easyeventqr.vercel.app \
            .

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview deploy ready!**\n\nCheck the preview at: https://pr-${{ github.event.number }}-easyeventqr.vercel.app'
            })

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Ídem: raíz del proyecto, no `dist/`, y mismo auth por token que el preview.
      - name: Deploy to Vercel Production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --project=${{ secrets.VERCEL_PROJECT_ID }} \
            .

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deploy successful!"
          else
            echo "❌ Production deploy failed!"
          fi