<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: para que en un iPhone con notch el header
      pueda llegar hasta el borde usando env(safe-area-inset-top).
      Es detalle de mobile-first desde el día uno.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="EasyEventQR — reservas y validación de entradas por QR" />
    <!--
      Sin esto el navegador pide /favicon.ico y recibe un 404 en cada
      carga: se ve en la consola y, peor, la pestaña queda con el ícono
      genérico del navegador. El SVG alcanza: todos los navegadores
      soportan favicon SVG, así que no hace falta además un .ico.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Antiflicker del tema: setea `data-theme` antes del bundle con la
      MISMA regla que `leerTema()` (guardada > sistema > claro).
    -->
    <script>
      try {
        var t = localStorage.getItem('easyeventqr-tema')
        if (t !== 'claro' && t !== 'oscuro') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!--
      Tipografías de la landing pública (/e/:id): Bebas Neue para el
      título del evento, Source Sans 3 para el cuerpo. display=swap para
      no bloquear el primer pintado; si Google Fonts no carga, cae al
      sistema sin romper nada.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>EasyEventQR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
